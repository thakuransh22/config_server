
spring:
  application:
    name: greek-servers
  boot:
    admin:
      client:
        url: "http://localhost:2222"

server:
  port: 9091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

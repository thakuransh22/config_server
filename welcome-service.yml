spring:
  application:
    name: welcome-service
  boot:
    admin:
      client:
        url: 
          http://localhost:2222
        instance:
          service-host-type: IP

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
welcome:
  message: Hello from GitHub configuration
